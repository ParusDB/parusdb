#
# Apache Polaris — catalogue Iceberg de ParusDB.
#
# Dépendances assumées (stack Supabase de apps/supabase) :
#   - réseau externe `supabase_default` (doit exister : la stack doit être démarrée) ;
#   - service `db` : Postgres Supabase, persistance relationnelle des métadonnées
#     du catalogue (base `polaris`, créée par setup.sh via sql/init-polaris-db.sql) ;
#   - service `rustfs` : object storage S3 des fichiers de données Iceberg
#     (override `docker-compose.rustfs.yml` côté Supabase).
#
# Rôles (AGENTS.md §10) : Polaris ne fait que du catalogue de métadonnées.
# Aucune donnée analytique dans le Postgres applicatif, aucun accès S3 direct
# hors Polaris/Trino.
#
# Démarrage : `sh run.sh start` (le service polaris-bootstrap crée le realm et
# les credentials root, puis s'arrête).
#
name: parus-polaris

networks:
  supabase:
    name: supabase_default
    external: true

services:

  # Initialisation idempotente du realm et du principal root dans le Postgres.
  # S'exécute à chaque `docker compose up`, puis se termine.
  polaris-bootstrap:
    image: apache/polaris-admin-tool:1.8.0
    container_name: parus-polaris-bootstrap
    restart: "no"
    networks:
      - supabase
    environment:
      POLARIS_PERSISTENCE_TYPE: relational-jdbc
      POLARIS_PERSISTENCE_RELATIONAL_JDBC_DATABASE_TYPE: postgresql
      POLARIS_PERSISTENCE_RELATIONAL_JDBC_MAX_RETRIES: "5"
      POLARIS_PERSISTENCE_RELATIONAL_JDBC_INITIAL_DELAY_IN_MS: "100"
      POLARIS_PERSISTENCE_RELATIONAL_JDBC_MAX_DURATION_IN_MS: "5000"
      QUARKUS_DATASOURCE_JDBC_URL: "jdbc:postgresql://${POLARIS_DB_HOST:-db}:${POLARIS_DB_PORT:-5432}/${POLARIS_DB_NAME:-polaris}"
      QUARKUS_DATASOURCE_USERNAME: "${POLARIS_DB_USER:-polaris}"
      QUARKUS_DATASOURCE_PASSWORD: "${POLARIS_DB_PASSWORD:?POLARIS_DB_PASSWORD manquant dans .env}"
    command:
      - bootstrap
      - "--realm=${POLARIS_REALM:-POLARIS}"
      - "--credential=${POLARIS_REALM:-POLARIS},${POLARIS_ROOT_CLIENT_ID:-root},${POLARIS_ROOT_CLIENT_SECRET:?POLARIS_ROOT_CLIENT_SECRET manquant dans .env}"

  polaris:
    image: apache/polaris:1.8.0
    container_name: parus-polaris
    restart: unless-stopped
    networks:
      - supabase
    depends_on:
      polaris-bootstrap:
        condition: service_completed_successfully
    ports:
      # API (Iceberg REST + management)
      - "${POLARIS_API_PORT:-8181}:8181"
      # Santé et métriques
      - "${POLARIS_MANAGEMENT_PORT:-8182}:8182"
    environment:
      # Persistance : Postgres de la stack Supabase (jamais de metastore mémoire).
      POLARIS_PERSISTENCE_TYPE: relational-jdbc
      POLARIS_PERSISTENCE_RELATIONAL_JDBC_DATABASE_TYPE: postgresql
      POLARIS_PERSISTENCE_RELATIONAL_JDBC_MAX_RETRIES: "5"
      POLARIS_PERSISTENCE_RELATIONAL_JDBC_INITIAL_DELAY_IN_MS: "100"
      POLARIS_PERSISTENCE_RELATIONAL_JDBC_MAX_DURATION_IN_MS: "5000"
      QUARKUS_DATASOURCE_JDBC_URL: "jdbc:postgresql://${POLARIS_DB_HOST:-db}:${POLARIS_DB_PORT:-5432}/${POLARIS_DB_NAME:-polaris}"
      QUARKUS_DATASOURCE_USERNAME: "${POLARIS_DB_USER:-polaris}"
      QUARKUS_DATASOURCE_PASSWORD: "${POLARIS_DB_PASSWORD:?POLARIS_DB_PASSWORD manquant dans .env}"
      # Realm et principal root (le secret ne vit que dans .env, jamais commité).
      POLARIS_BOOTSTRAP_CREDENTIALS: "${POLARIS_REALM:-POLARIS},${POLARIS_ROOT_CLIENT_ID:-root},${POLARIS_ROOT_CLIENT_SECRET:?POLARIS_ROOT_CLIENT_SECRET manquant dans .env}"
      POLARIS_REALM_CONTEXT_REALMS: "${POLARIS_REALM:-POLARIS}"
      # Telemetry locale désactivée : pas de collecteur OTLP dans cette stack.
      QUARKUS_OTEL_SDK_DISABLED: "true"
      # Clés RSA du token broker OAuth2 : générées par setup.sh et montées en
      # lecture seule (cf. doc Polaris « configuring for production »). Sans
      # clés persistantes, chaque redémarrage de Polaris invalide tous les
      # jetons émis (les clients Trino conservent le leur en cache).
      POLARIS_AUTHENTICATION_TOKEN_BROKER_RSA_KEY_PAIR_PUBLIC_KEY_FILE: /opt/polaris/keys/public.key
      POLARIS_AUTHENTICATION_TOKEN_BROKER_RSA_KEY_PAIR_PRIVATE_KEY_FILE: /opt/polaris/keys/private.key
      # Credentials RustFS vendus aux clients (Trino, pipelines dlt) pour
      # l'accès object storage ; aucune chaîne de connexion dans les prompts LLM.
      AWS_REGION: "${S3_REGION:-us-east-1}"
      AWS_ACCESS_KEY_ID: "${S3_ACCESS_KEY_ID:?S3_ACCESS_KEY_ID manquant dans .env}"
      AWS_SECRET_ACCESS_KEY: "${S3_SECRET_ACCESS_KEY:?S3_SECRET_ACCESS_KEY manquant dans .env}"
      # Filet de sécurité : autorise le chevauchement des allowedLocations
      # entre catalogues. Le catalogue par défaut (dev) créé par une install
      # antérieure a allowedLocations = bucket entier. L'app tente de le
      # corriger automatiquement au premier createCatalog (API PUT avec
      # currentEntityVersion) ; ce flag couvre le cas où la correction
      # échoue (Polaris temporairement injoignable).
      # À retirer quand tous les catalogues ont des allowedLocations isolés
      # par sous-répertoire (s3://bucket/<nom>).
      POLARIS_FEATURES_ALLOW_OVERLAPPING_CATALOG_URLS: "true"
    volumes:
      - ./volumes/token-keys:/opt/polaris/keys:ro
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8182/q/health"]
      interval: 5s
      timeout: 10s
      retries: 20
      start_period: 30s
