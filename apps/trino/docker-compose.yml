#
# Trino — moteur SQL du Data Lakehouse ParusDB.
#
# Rôle strict (AGENTS.md §10) : Trino est l'unique moteur de requêtage. Il ne
# connaît pas le RustFS directement : il interroge Apache Polaris (apps/polaris)
# via le protocole Iceberg REST et reçoit des credentials vendus (vended
# credentials). Aucune chaîne de connexion, aucun secret d'infrastructure dans
# les sessions des utilisateurs.
#
# Dépendances assumées :
#   - réseau externe `supabase_default` (stack Supabase démarrée) ;
#   - service `polaris` (apps/polaris) : catalogue Iceberg REST, OAuth2 ;
#   - service `rustfs` (stack Supabase) : accès S3 aux fichiers de données,
#     avec credentials vendus par Polaris.
#
# Pas de depends_on possible entre projets compose distincts : `sh run.sh start`
# vérifie que Polaris est démarré et sain avant de lancer Trino.
#
# Démarrage : `sh run.sh start` (après `sh setup.sh`).
#
name: parus-trino

networks:
  supabase:
    name: supabase_default
    external: true

services:

  trino:
    image: trinodb/trino:484
    container_name: parus-trino
    restart: unless-stopped
    networks:
      - supabase
    ports:
      # UI web + API HTTP
      - "${TRINO_PORT:-8080}:8080"
    environment:
      # Injectées dans catalog/polaris.properties (substitution ${ENV:VAR}).
      POLARIS_URI: "${POLARIS_URI:-http://polaris:8181/api/catalog}"
      POLARIS_CATALOG_NAME: "${POLARIS_CATALOG_NAME:-dev}"
      POLARIS_REALM: "${POLARIS_REALM:-POLARIS}"
      CLIENT_ID: "${POLARIS_CLIENT_ID:?POLARIS_CLIENT_ID manquant dans .env}"
      CLIENT_SECRET: "${POLARIS_CLIENT_SECRET:?POLARIS_CLIENT_SECRET manquant dans .env}"
      S3_ENDPOINT: "${S3_ENDPOINT:-http://rustfs:9000}"
      S3_REGION: "${S3_REGION:-us-east-1}"
    volumes:
      # Catalogue `polaris` : Iceberg REST → Polaris.
      - ./catalog:/etc/trino/catalog:ro
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/v1/info"]
      interval: 5s
      timeout: 10s
      retries: 20
      start_period: 30s
