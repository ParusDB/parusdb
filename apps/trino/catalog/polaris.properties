#
# Catalogue Trino `polaris` : moteur SQL branché sur Apache Polaris (apps/polaris)
# via le protocole Iceberg REST, avec credentials S3 vendus par Polaris.
#
# Toutes les valeurs sont injectées par variables d'environnement (déclarées
# dans docker-compose.yml, alimentées par .env) : rien n'est codé en dur ici.
#
# Le nom du catalogue Trino est le nom de ce fichier (`polaris`) ;
# `iceberg.rest-catalog.warehouse` désigne le catalogue Polaris interrogé
# (environnement, ex. dev).
#
connector.name=iceberg
iceberg.catalog.type=rest
iceberg.rest-catalog.uri=${ENV:POLARIS_URI}
iceberg.rest-catalog.security=OAUTH2
iceberg.rest-catalog.oauth2.credential=${ENV:CLIENT_ID}:${ENV:CLIENT_SECRET}
iceberg.rest-catalog.oauth2.scope=PRINCIPAL_ROLE:ALL
iceberg.rest-catalog.warehouse=${ENV:POLARIS_CATALOG_NAME}
# Credentials vendus par Polaris : Trino ne stocke aucun secret S3 statique.
iceberg.rest-catalog.vended-credentials-enabled=true
# En-tête requis pour router les requêtes vers le bon realm Polaris.
iceberg.rest-catalog.http-headers=Polaris-Realm: ${ENV:POLARIS_REALM}
# Accès S3 au RustFS de la stack Supabase (path-style requis).
fs.s3.enabled=true
s3.endpoint=${ENV:S3_ENDPOINT}
s3.path-style-access=true
s3.region=${ENV:S3_REGION}
