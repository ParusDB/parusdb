version: 2
updates:
  - package-ecosystem: npm
    directory: /apps/nextjs
    schedule:
      interval: weekly
    groups:
      dev-dependencies:
        dependency-type: development
      minor-updates:
        update-types:
          - minor
          - patch
    open-pull-requests-limit: 5
    labels:
      - dependencies

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns:
          - "*"
    labels:
      - dependencies

  - package-ecosystem: docker
    directory: /apps/dlt
    schedule:
      interval: weekly
    labels:
      - dependencies
